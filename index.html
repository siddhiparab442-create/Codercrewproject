<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Organizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>

<body>

<div class="container">

    <div class="logo-box">
        <h2>Engictivity</h2>
    </div>

    <h1>Study Organizer</h1>
    <p class="subtitle">Organize your learning materials with AI assistance</p>

    <div class="login-box">
        <h2>Welcome back</h2>
        <p>Sign in to access your study materials</p>

        <label>Email</label>
        <input type="email" id="email" placeholder="student@university.edu">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button class="signin-btn" onclick="signIn()">Sign In</button>

        <div class="divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <button onclick="googleSignIn()">Sign In </button>


    </div>

</div>

<script src="script.js"></script>
</body>
</html>

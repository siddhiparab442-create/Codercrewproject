<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Organizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>

<body>

<div class="container">

    <div class="logo-box">
        <h2>Engictivity</h2>
    </div>

    <h1>Study Organizer</h1>
    <p class="subtitle">Organize your learning materials with AI assistance</p>

    <div class="login-box">
        <h2>Welcome back</h2>
        <p>Sign in to access your study materials</p>

        <label>Email</label>
        <input type="email" id="email" placeholder="student@university.edu">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button class="signin-btn" onclick="signIn()">Sign In</button>

        <div class="divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <button onclick="googleSignIn()">Sign In </button>


    </div>

</div>

<script src="script.js"></script>



<script type="module">
  import { initializeApp } from 
  "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

  import { getAuth, createUserWithEmailAndPassword } 
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_ID",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("signupForm");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();   // 🔥 THIS STOPS REFRESH

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("Signup Successful 🚀");
    } catch (error) {
      alert(error.message);
    }
  });
</script>


</body>
</html>
